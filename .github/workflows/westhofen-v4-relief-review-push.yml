name: Westhofen V4 altar-relief review raster push

on:
  push:
    branches: ['art/westhofen-v4-relief-review-20261115']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: westhofen-v4-relief-review-push
  cancel-in-progress: false

jobs:
  rasterize-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rasterizer dependencies
        run: python -m pip install 'CairoSVG>=2.7,<3' 'Pillow>=11,<14'
      - name: Validate V4 altar-relief source
        run: python tests/westhofen-v4-relief-source.test.py
      - name: Rasterize V4 relief and build altar review sheets
        run: |
          python - <<'EOF'
          from pathlib import Path
          import io
          import cairosvg
          from PIL import Image, ImageDraw

          ROOT = Path(".")
          OUT = ROOT / "build/westhofen-v4-relief"
          OUT.mkdir(parents=True, exist_ok=True)

          def img(source, w=768, h=512):
              png = cairosvg.svg2png(url=str(source), output_width=w, output_height=h)
              return Image.open(io.BytesIO(png)).convert("RGBA")

          new = img(ROOT / "docs/graphics/westhofen-v4-relief/westhofen-composite-v4-relief.svg")
          old = img(ROOT / "dist/assets/westhofen/westhofen-memorial-style2-v3-preview.svg")

          panel = Image.new("RGB", (1576, 1160), "#1a2320")
          d = ImageDraw.Draw(panel)
          d.text((18, 14), "WESTHOFEN V4 ALTAR-SIDE-RELIEF - REVIEW ONLY / NOT APPROVED / NOT RUNTIME", fill="#eee2bf")
          for col, (name, source) in enumerate((("CURRENT LIVE (preview3)", old), ("V4 ALTAR-RELIEF CANDIDATE", new))):
              x = 20 + col * 778
              d.text((x, 44), name, fill="#eee0ba")
              for row, bg in enumerate(("#d8d6cc", "#202a27")):
                  c = Image.new("RGBA", (768, 512), bg)
                  c.alpha_composite(source)
                  panel.paste(c.convert("RGB"), (x, 66 + row * 528))
          panel.save(OUT / "westhofen-v4-relief-full-review.jpg", "JPEG", quality=82, optimize=True)

          # Altar close-up at 4x: recess panel x290..520, y310..390
          crop_panel = Image.new("RGB", (1160, 400), "#1a2320")
          cd = ImageDraw.Draw(crop_panel)
          cd.text((18, 12), "ALTAR RECESS PANEL AT 4X - depth planes only, no invented scene or text", fill="#eee2bf")
          for col, (name, source) in enumerate((("CURRENT", old), ("V4 CANDIDATE", new))):
              crop = source.crop((285, 305, 525, 395)).resize((920, 320), Image.Resampling.LANCZOS)
              x = 15 + col * 575
              crop_panel.paste(crop, (x, 55))
              cd.text((x, 42), name, fill="#eee0ba")
          crop_panel.save(OUT / "westhofen-v4-relief-altar-review.jpg", "JPEG", quality=85, optimize=True)
          print("review rasters written")
          EOF
      - name: Publish review rasters on this branch
        run: |
          mkdir -p docs/graphics/westhofen-v4-relief/review-20261115
          cp build/westhofen-v4-relief/* docs/graphics/westhofen-v4-relief/review-20261115/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/graphics/westhofen-v4-relief/review-20261115
          if git diff --cached --quiet; then
            echo 'Review rasters unchanged.'
            exit 0
          fi
          git commit -m 'review(westhofen-v4): publish altar-relief review rasters (review only, not runtime)'
          git push