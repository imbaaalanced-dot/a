name: TD2 Reference Ground V3 QA
on:
  push:
    branches: ['feature/td2-ground-v3-reference-20261113', 'feature/td2-ground-v3-default-20261113']
  pull_request:
    branches: [main]
    paths:
      - 'dist/ground-v3.js'
      - 'dist/terrain-polish.js'
      - 'dist/style2-maps.js'
      - 'dist/church-art.js'
      - 'dist/hohensyburg-art.js'
      - 'dist/goethestrasse-art.js'
      - 'dist/westhofen-art.js'
      - 'dist/index.html'
      - 'dist/assets/reference-ground-v3/**'
      - 'tests/reference-ground-v3.test.cjs'
      - 'tests/ground-late-load.test.cjs'
      - 'tools/verify-ground-late-load-browser.cjs'
      - 'tools/verify-reference-ground-v3-browser.cjs'
      - 'tools/verify-level4-seamfix-browser.cjs'
      - 'dist/assets/level4/**'
      - '.github/workflows/td2-reference-ground-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ground-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Material and renderer unit/regression tests
        run: |
          node tests/reference-ground-v3.test.cjs
          node tests/cache-busting.test.cjs
          node tests/ground-late-load.test.cjs
          node tests/terrain-polish.test.cjs
          node tests/style2-maps.test.cjs
          node tests/style2-ground.test.cjs
          node tests/level4.test.cjs
          node tests/westhofen.test.cjs
      - name: Prepare Chromium smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Delayed V3 decode refreshes all seven cached grounds
        run: node tools/verify-ground-late-load-browser.cjs
      - name: Compare default and V3 levels 1–7 desktop/mobile-touch
        run: node tools/verify-reference-ground-v3-browser.cjs
      - name: Compare Level 4 standard V3 and seamfix preview desktop/mobile-touch
        run: node tools/verify-level4-seamfix-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: td2-reference-ground-v3-screenshots
          path: /tmp/td2-reference-ground-v3/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: td2-level4-seamfix-desktop-touch
          path: /tmp/td2-level4-seamfix/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: td2-ground-late-load-desktop-touch
          path: /tmp/td2-late-ground/
          if-no-files-found: warn
          retention-days: 7
