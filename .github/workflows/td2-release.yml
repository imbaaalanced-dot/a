name: TD2 release from notes

on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: td2-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and GitHub release from notes file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE=$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" | grep '^docs/releases/.*\.md$' | head -1 || true)
          if [ -z "${FILE:-}" ]; then echo 'No release notes file in this push.'; exit 0; fi
          TAG=$(sed -n '1s/^tag: *//p' "$FILE")
          TITLE=$(sed -n '2s/^title: *//p' "$FILE")
          if [ -z "$TAG" ] || [ -z "$TITLE" ]; then echo 'Malformed release notes (need tag:/title: header).'; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists - nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TITLE"
          git push origin "refs/tags/$TAG"
          BODY=$(mktemp)
          sed '1,2d' "$FILE" > "$BODY"
          gh release create "$TAG" --title "$TITLE" --notes-file "$BODY" --target "${GITHUB_SHA}"
