name: TD2 Level 5 balance preview
on:
  push:
    branches: [fix/level5-opening-balance-20261026]
permissions:
  contents: write
concurrency:
  group: td2-level5-balance-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game and asset references
        run: |
          set -e
          python3 -m pip install Pillow
          for test in tests/*.test.cjs; do node "$test"; done
          TEST_MOBILE=1 node tests/menu-navigation.test.cjs
          TEST_MOBILE=1 node tests/game.test.cjs
          for test in tests/*.test.py; do python3 "$test"; done
      - name: Publish isolated preview
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/td2-visual-preview origin/gh-pages
          mkdir -p /tmp/td2-visual-preview/td2-level5-balance/v4-level5
          cp -R dist/. /tmp/td2-visual-preview/td2-level5-balance/v4-level5/
          touch /tmp/td2-visual-preview/.nojekyll
          cd /tmp/td2-visual-preview
          git add td2-level5-balance .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish TD2 Level 5 balance preview ${GITHUB_SHA}"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
