name: TD2 portrait home v2 preview
on:
  push:
    branches: [feature/td2-portrait-home-v2-20261106]
permissions:
  contents: write
concurrency:
  group: td2-portrait-home-v2-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify refined portrait home and existing navigation
        run: |
          set -e
          node tests/portrait-home-v1.test.cjs
          node tests/cache-busting.test.cjs
          node tests/main-menu.test.cjs
          node tests/menu-navigation.test.cjs
          TEST_MOBILE=1 node tests/menu-navigation.test.cjs
          node tests/portrait-avatars-v5.test.cjs
          node --check dist/portrait-home-v1.js
          test -f dist/assets/menu/crest-v3.webp
          test -f dist/ansturm/index.html
      - name: Publish separate Android browser preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/td2-home-v2-pages origin/gh-pages
          mkdir -p /tmp/td2-home-v2-pages/td2-portrait-home-v2-preview
          cp -R dist/. /tmp/td2-home-v2-pages/td2-portrait-home-v2-preview/
          touch /tmp/td2-home-v2-pages/.nojekyll
          cd /tmp/td2-home-v2-pages
          git add td2-portrait-home-v2-preview .nojekyll
          if git diff --cached --quiet; then
            echo "Portrait home v2 preview is up to date."
            exit 0
          fi
          git commit -m "Publish portrait home v2 preview ${GITHUB_SHA}"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
