name: Ansturm legacy save export
on:
  pull_request:
    paths:
      - 'dist/ansturm-save-export*'
      - 'tests/ansturm-save-export.test.mjs'
      - '.github/workflows/ansturm-save-export.yml'
jobs:
  export-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ansturm-save-export.test.mjs
