name: TD2 Ansturm integration preview
on:
  push:
    branches: [feature/td2-ansturm-integration-20261023]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: td2-ansturm-integration-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert standalone TD runtime and legacy save bridge
        run: |
          node tests/ansturm-integration.test.cjs
          node --test tests/ansturm-save-export.test.mjs
      - name: TD regression coverage after game separation
        run: |
          for test in tests/*.test.cjs; do node "$test"; done
