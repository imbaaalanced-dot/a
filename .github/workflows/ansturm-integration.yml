name: TD2 Ansturm integration preview
on:
  push:
    branches: [feature/td2-ansturm-integration-20261023]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: td2-ansturm-integration-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Ansturm and TD2 integration
        run: |
          npm test --prefix ansturm-alpha1-5
          for test in tests/*.test.cjs; do node "$test"; done
