name: TD2 Ansturm integration preview
on:
  push:
    branches: [feature/td2-ansturm-integration-20261023]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: td2-ansturm-integration-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory remaining Ansturm dependencies (read-only)
        run: |
          echo 'BASE_TREE:'
          git rev-parse HEAD^{tree}
          echo 'LEGACY_TRACKED_FILES:'
          git ls-files -- ansturm-alpha1-5 dist/ansturm dist/td2-ansturm-tutorial
          echo 'REMAINING_ACTIVE_REFERENCES:'
          git grep -Il -E 'ansturm-alpha1-5|dist/ansturm|ansturm/index\.html|td2-ansturm-tutorial|menuAnsturmBtn' -- .github tools tests dist/index.html dist/game.js dist/menu.css || true
      - name: TD regression coverage after game separation
        run: |
          for test in tests/*.test.cjs; do node "$test"; done
