name: TD2 menu and touch integration QA

on:
  push:
    branches: [integration/menu-touch-review-20261106]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: td2-menu-touch-qa-20261106
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify UI, gameplay, cache and mobile touch guards
        run: |
          set -e
          node --check dist/game.js
          node --check dist/loot-ui.js
          node --check dist/level-gallery.js
          node --test tests/*.test.cjs
          TEST_MOBILE=1 node tests/game.test.cjs
          python -m pip install Pillow numpy scipy
          python tests/assets.test.py
      - name: Publish isolated mobile review preview
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/td2-menu-touch-pages origin/gh-pages
          mkdir -p /tmp/td2-menu-touch-pages/td2-menu-touch-20261106
          cp -R dist/. /tmp/td2-menu-touch-pages/td2-menu-touch-20261106/
          printf '%s\n' "${GITHUB_SHA}" > /tmp/td2-menu-touch-pages/td2-menu-touch-20261106/source-commit.txt
          touch /tmp/td2-menu-touch-pages/.nojekyll
          cd /tmp/td2-menu-touch-pages
          git add td2-menu-touch-20261106 .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated touch review preview ${GITHUB_SHA}"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
