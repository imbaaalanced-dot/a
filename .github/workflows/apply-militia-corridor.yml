name: Miliz-Korridor-Patch anwenden
on:
  pull_request:
    paths:
      - 'patches/militia-corridor.patch'
permissions:
  contents: write
concurrency:
  group: militia-corridor-apply-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch anwenden und Artefakte entfernen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --whitespace=nowarn patches/militia-corridor.patch
          git rm -q patches/militia-corridor.patch .github/workflows/apply-militia-corridor.yml
          git add -A
          git commit -m 'fix(barracks): Miliz hält 82px-Wachtkorridor um den Lane-Posten (bot apply)'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
