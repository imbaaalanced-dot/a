name: Westhofen V3 forecourt mobile portrait comparison

on:
  pull_request:
    branches:
      - integration/td2-westhofen-v3-level7-20261113
    paths:
      - dist/westhofen-art.js
      - tests/westhofen-v3-forecourt.test.cjs
      - .github/workflows/westhofen-v3-forecourt-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portrait:
    name: V3 forecourt regression and before/after mobile Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test forecourt geometry and Level 7 game/save invariants
        run: |
          node tests/westhofen-v3-forecourt.test.cjs
          node tests/westhofen-v3-runtime.test.cjs
          node tests/westhofen.test.cjs
          node tests/level67-single-image-owner.test.cjs
          node tests/asset-manager.test.cjs
      - name: Install Chromium for desktop and touch portrait QA
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Verify sprite draw, Level 7, mobile touch and failed requests
        env:
          TD2_LEVEL7_ENVIRONMENT_OUT: /tmp/westhofen-v3-forecourt-after
        run: timeout 240s node tools/verify-level7-style2-environment.cjs
      - name: Retrieve previous unchanged V3 gameplay screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/westhofen-v3-forecourt-before
          gh run download 43515530150 -R "$GITHUB_REPOSITORY" -n westhofen-v3-level7-chromium-review-only -D /tmp/westhofen-v3-forecourt-before
      - name: Produce real side-by-side portrait and cropped seam inspection
        env:
          BEFORE: /tmp/westhofen-v3-forecourt-before
          AFTER: /tmp/westhofen-v3-forecourt-after
        run: |
          python3 -m pip install --quiet 'Pillow>=11,<14'
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat,ImageChops
          previous=Path(os.environ['BEFORE'])
          current=Path(os.environ['AFTER'])
          old=Image.open(previous/'mobile-westhofen-gameplay.png').convert('RGB')
          new=Image.open(current/'mobile-westhofen-gameplay.png').convert('RGB')
          assert old.size==new.size==(412,915),(old.size,new.size)
          # Pixel coordinates of the fixed memorial forecourt at 412x915
          crop=(92,294,320,463)
          before=old.crop(crop);after=new.crop(crop)
          report=Image.new('RGB',(1120,1100),'#1b2420')
          d=ImageDraw.Draw(report)
          d.text((16,16),'WESTHOFEN V3 | MOBILE CHROMIUM 412x915 | BEFORE / AFTER FORECOURT FIX',fill='#f1e6c7')
          report.paste(old,(16,55));report.paste(new,(590,55))
          d.text((16,978),'Before: previous unchanged V3 PR #257 gameplay',fill='#e0d2b8')
          d.text((590,978),'After: clipped irregular flagstones / soft ground seam',fill='#e0d2b8')
          report.save(current/'westhofen-v3-forecourt-portrait-before-after.jpg',quality=78,optimize=True)
          detail=Image.new('RGB',(960,800),'#1b2420')
          dd=ImageDraw.Draw(detail)
          dd.text((15,13),'CROPPED FORECOURT | ACTUAL PIXELS, ENLARGED 2X (NO NEW RENDER)',fill='#f1e6c7')
          detail.paste(before.resize((456,338),Image.Resampling.NEAREST),(12,58))
          detail.paste(after.resize((456,338),Image.Resampling.NEAREST),(492,58))
          dd.text((14,410),'Previous V3',fill='#ddd1b3')
          dd.text((494,410),'Forecourt patch',fill='#ddd1b3')
          detail.save(current/'westhofen-v3-forecourt-detail-before-after.jpg',quality=83,optimize=True)
          delta=ImageStat.Stat(ImageChops.difference(before,after))
          print('FORECOURT_CROP_CHANNEL_MEAN_ABSOLUTE_CHANGE='+str([round(v,2) for v in delta.mean]))
          # A zero difference means the new level has not visibly changed.
          assert max(delta.mean)>1, 'expected a visible difference in the mobile forecourt crop'
          data=(current/'westhofen-v3-forecourt-detail-before-after.jpg').read_bytes()
          print('FORECOURT_DETAIL_B64='+base64.b64encode(data).decode('ascii'))
          PY
      - name: Upload mobile visual evidence and browser reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: westhofen-v3-forecourt-mobile-before-after
          path: /tmp/westhofen-v3-forecourt-after/
          retention-days: 14
          if-no-files-found: warn
