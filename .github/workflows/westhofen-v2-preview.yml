name: Westhofen V2 Sprite Source Preview
on:
  pull_request:
    paths:
      - 'docs/graphics/westhofen-v2/**'
      - 'tests/westhofen-v2-source.test.py'
      - 'tools/export-westhofen-v2.py'
      - '.github/workflows/westhofen-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview rasterizer dependencies
        run: python -m pip install 'CairoSVG>=2.7,<3' 'Pillow>=11,<14'
      - name: Validate SVG structures
        run: python tests/westhofen-v2-source.test.py
      - name: Export 768x512 RGBA previews and 64/128px inspections
        run: python tools/export-westhofen-v2.py --out build/westhofen-v2
      - name: Upload preview pack, not runtime game assets
        uses: actions/upload-artifact@v4
        with:
          name: westhofen-v2-review-only
          path: build/westhofen-v2/
          if-no-files-found: error
          retention-days: 14
