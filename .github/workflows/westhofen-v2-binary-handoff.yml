name: Westhofen V2 one-time binary handoff
on:
  pull_request:
    paths:
      - '.github/workflows/westhofen-v2-binary-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rasterizer
        run: python -m pip install 'CairoSVG>=2.7,<3' 'Pillow>=11,<14'
      - name: Export V2 from the reviewed source tree
        run: |
          python tests/westhofen-v2-source.test.py
          python tools/export-westhofen-v2.py --out build/westhofen-v2
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib
          p=Path('build/westhofen-v2/westhofen-composite-v2.webp')
          raw=p.read_bytes()
          assert len(raw)==28724, f'asset bytes changed: {len(raw)}'
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='201018d2eb08c795d528e45ef3601a5b9a4c8ed03a6991502517d20e090fb252', digest
          print('BEGIN_TD2_WESTHOFEN_V2_BASE64')
          print(base64.b64encode(raw).decode('ascii'))
          print('END_TD2_WESTHOFEN_V2_BASE64')
          PY
