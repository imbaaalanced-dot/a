name: Gameplay-Feel-Patch anwenden und Baseline neu aufnehmen
on:
  pull_request:
    paths:
      - 'patches/gameplay-feel.patch'
permissions:
  contents: write
concurrency:
  group: gameplay-feel-apply-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch anwenden, Baseline neu aufnehmen, Artefakte entfernen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --whitespace=nowarn patches/gameplay-feel.patch
          git add -A
          git commit -m 'fix(gameplay): Verkauf 80%, Level-1-Start 90/6, Magier-Slow nach Stufe (bot apply)'
          ANCHOR=$(git rev-parse HEAD)
          node patches/record-baseline.cjs "$ANCHOR"
          git rm -q patches/gameplay-feel.patch patches/record-baseline.cjs .github/workflows/apply-gameplay-feel.yml
          git add -A
          git commit -m "test(simulation): Baseline neu aufgenommen auf '$(git rev-parse --short=7 "$ANCHOR")' (bot apply)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
