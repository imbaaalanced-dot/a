name: Westhofen V3 Stone and Altar Art Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/graphics/westhofen-v3-stone/**'
      - 'tests/westhofen-v3-stone-source.test.py'
      - 'tools/export-westhofen-v3-stone.py'
      - '.github/workflows/westhofen-v3-stone-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview tooling
        run: python -m pip install 'CairoSVG>=2.7,<3' 'Pillow>=11,<14'
      - name: Check safe SVG source, preserved historical features and draw order
        run: python tests/westhofen-v3-stone-source.test.py
      - name: Export transparent 768x512 WebP and compare 64/128px graphics
        run: python tools/export-westhofen-v3-stone.py --out build/westhofen-v3-stone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: westhofen-v3-stone-review-only
          path: build/westhofen-v3-stone/
          if-no-files-found: error
          retention-days: 14
