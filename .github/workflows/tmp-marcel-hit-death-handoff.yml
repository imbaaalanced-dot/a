name: Temporary binary handoff for Marcel hit/death-down candidates
on:
  push:
    branches: [art/marcel-down-hit-death-candidates-20261113]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Decode payloads and verify checksums
        run: |
          set -euxo pipefail
          ls -la .handoff/marcel-hit-death-down/
          mkdir -p source-art/hero/actions-v5/marcel/down/hit source-art/hero/actions-v5/marcel/down/death
          for i in 0 1 2 3 4 5; do
            base64 -d .handoff/marcel-hit-death-down/hit-$i.b64.txt > source-art/hero/actions-v5/marcel/down/hit/0$i.png
            base64 -d .handoff/marcel-hit-death-down/death-$i.b64.txt > source-art/hero/actions-v5/marcel/down/death/0$i.png
          done
          base64 -d .handoff/marcel-hit-death-down/hit-sheet.b64.txt > source-art/hero/actions-v5/marcel/down/marcel-hit-down-concept-3x2.png
          cat .handoff/marcel-hit-death-down/death-sheet-a.b64.txt .handoff/marcel-hit-death-down/death-sheet-b.b64.txt | base64 -d > source-art/hero/actions-v5/marcel/down/marcel-death-down-concept-3x2.png
          base64 -d .handoff/marcel-hit-death-down/hit-preview.b64.txt > source-art/hero/actions-v5/marcel/down/marcel-hit-down-preview-6x1.png
          base64 -d .handoff/marcel-hit-death-down/death-preview.b64.txt > source-art/hero/actions-v5/marcel/down/marcel-death-down-preview-6x1.png
          sha256sum -c .handoff/marcel-hit-death-down/sha256.txt
      - name: Commit decoded art and remove handoff payloads
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-art/hero/actions-v5/marcel/down
          git rm -r -q .handoff
          git rm -q .github/workflows/tmp-marcel-hit-death-handoff.yml
          git commit -m "art(Style 2): decode Marcel hit/death-down candidate frames from temporary handoff"
          git push
      - name: Diagnose on failure
        if: failure()
        run: |
          set +e
          {
            echo "=== runner context ==="
            echo "GITHUB_REF=$GITHUB_REF SHA=$GITHUB_SHA"
            echo "=== git status ==="
            git status --short
            echo "=== git log ==="
            git log --oneline -5
            echo "=== sha256 verbose ==="
            sha256sum -c .handoff/marcel-hit-death-down/sha256.txt
            echo "=== ls handoff ==="
            ls -la .handoff/marcel-hit-death-down/ || true
          } > failure-diagnosis.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add failure-diagnosis.txt
          git commit -m "chore(handoff): write failure diagnosis" || exit 0
          git push || exit 0
