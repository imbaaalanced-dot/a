name: Test Denkmal TD

on:
  push:
    branches: ["main", "release/v3.*", "feature/td2-v4-main-menu-refresh", "feature/td2-v4-alpha4-combat", "feature/v4-level4-church-lion", "feature/style2-churchyard-pass1-20261016", "feature/style2-kirchende-pass2-20261016"]
  pull_request:
    branches: ["main", "v4-kirchende", "feature/td2-terrain-stars-alpha5", "feature/v4-alpha5-unified-kirchende", "feature/style2-churchyard-pass1-20261016"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Main menu structure and unlock routes
        run: node tests/main-menu.test.cjs
      - name: Level 1 intro tutorial regression suite
        run: node tests/intro-tutorial.test.cjs
      - name: Preloader startup regression suite
        run: node tests/preloader.test.cjs
      - name: Release badge and cache key regression
        run: node tests/cache-busting.test.cjs
      - name: Kirchende terrain and renderer caching
        run: |
          node tests/terrain-polish.test.cjs
          node tests/kirchende-loading.test.cjs
          node tests/style2-kirchende.test.cjs
      - name: Portrait HUD and hero/loot navigation regression
        run: node tests/portrait-hud.test.cjs
      - name: Persistent loot regression suite
        run: node tests/loot.test.cjs
      - name: Gameplay regression suite
        run: node tests/game.test.cjs
      - name: Mobile gameplay regression suite
        run: TEST_MOBILE=1 node tests/game.test.cjs
      - name: Combat FX regression suite
        run: node tests/combat-fx.test.cjs
      - name: V4 alpha.4 + alpha.5 and churchyard regression
        run: |
          node tests/v4-alpha4.test.cjs
          node tests/v4-alpha5.test.cjs
          TEST_MOBILE=1 node tests/v4-alpha5.test.cjs
          node tests/level4.test.cjs
          TEST_MOBILE=1 node tests/level4.test.cjs
      - name: v3.1 + v3.2 feature regression suite
        run: node tests/v3.1-features.test.cjs

      - name: Verify hero image decoding
        run: |
          python -m pip install Pillow
          python tests/assets.test.py
