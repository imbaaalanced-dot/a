name: Test Denkmal TD

on:
  push:
    branches: ["feature/td2-v4-alpha9-performance-style2", "assets/style2-user-towers-1to5-20261020", "feature/td2-enemy-animation-pack", "feature/td2-menu-hero-banner", "main", "release/v3.*", "feature/td2-v4-main-menu-refresh", "feature/td2-v4-alpha4-combat", "feature/v4-level4-church-lion", "feature/style2-churchyard-pass1-20261016", "feature/style2-kirchende-pass2-20261016", "feature/style2-cannon-pass3-20261016", "feature/style2-towers-pass4-20261016", "feature/style2-maps-pass5-20261016", "feature/style2-phase6-20261016", "feature/style2-phase7-ambience-20261018", "feature/level5-hohensyburg-20261018", "integrate/td2-v4-20261018", "feature/td2-v4-alpha8-environment-character"]
  pull_request:
    branches: ["feature/td2-v4-alpha8-environment-character", "feature/td2-v4-alpha9-performance-style2", "main", "v4-kirchende", "feature/td2-terrain-stars-alpha5", "feature/v4-alpha5-unified-kirchende", "feature/style2-churchyard-pass1-20261016", "feature/style2-kirchende-pass2-20261016", "feature/style2-cannon-pass3-20261016", "feature/style2-towers-pass4-20261016", "feature/style2-phase7-ambience-20261018"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Alpha 8 preview preserves campaign flags
        run: |
          node tests/loot-ui.test.cjs
          node tests/menu-navigation.test.cjs
          TEST_MOBILE=1 node tests/menu-navigation.test.cjs
          node tests/startup-loading.test.cjs
          node tests/alpha8-preview.test.cjs
          TEST_MOBILE=1 node tests/alpha8-preview.test.cjs
      - name: Main menu structure and unlock routes
        run: node tests/main-menu.test.cjs
      - name: Level 1 intro tutorial regression suite
        run: node tests/intro-tutorial.test.cjs
      - name: Preloader startup regression suite
        run: |
          node tests/preloader.test.cjs
          node tests/asset-manager.test.cjs
      - name: Release badge and cache key regression
        run: node tests/cache-busting.test.cjs
      - name: Kirchende terrain and renderer caching
        run: |
          node tests/terrain-polish.test.cjs
          node tests/kirchende-loading.test.cjs
          node tests/style2-kirchende.test.cjs
          node tests/style2-cannon.test.cjs
          node tests/style2-towers.test.cjs
          node tests/elemental-sprites.test.cjs
          node tests/style2-user-towers.test.cjs
          node tests/style2-adapter-regression.cjs
          node tests/style2-cache-pressure.cjs
          node tests/enemy-animations.test.cjs
          node tests/flight-enemies.test.cjs
          node tests/goethestrasse.test.cjs
          node tests/goethestrasse-preview.test.cjs
          node tests/level5.test.cjs
          node tests/level5-preview.test.cjs
          TEST_MOBILE=1 node tests/level5-preview.test.cjs
          node tests/style2-maps.test.cjs
          node tests/style2-phase6.test.cjs
          node tests/style2-ground.test.cjs
          node tests/style2-markers.test.cjs
          node tests/style2-ambience.test.cjs
          node tests/style2-level4-reference.test.cjs
          node tests/style2-church-sprite.test.cjs
      - name: Portrait HUD and hero/loot navigation regression
        run: node tests/portrait-hud.test.cjs
      - name: Persistent loot regression suite
        run: node tests/loot.test.cjs
      - name: Gameplay regression suite
        run: node tests/game.test.cjs
      - name: Mobile gameplay regression suite
        run: TEST_MOBILE=1 node tests/game.test.cjs
      - name: Combat FX regression suite
        run: node tests/combat-fx.test.cjs
      - name: V4 alpha.4 + alpha.5 and churchyard regression
        run: |
          node tests/v4-alpha4.test.cjs
          node tests/v4-alpha5.test.cjs
          TEST_MOBILE=1 node tests/v4-alpha5.test.cjs
          node tests/level4.test.cjs
          TEST_MOBILE=1 node tests/level4.test.cjs
      - name: v3.1 + v3.2 feature regression suite
        run: node tests/v3.1-features.test.cjs

      - name: Verify hero image decoding
        run: |
          python -m pip install Pillow
          python tests/assets.test.py
          python tests/alpha8-assets.test.py
          python tests/alpha9-assets.test.py
          python tests/alpha9-user-towers.test.py
          python tests/style2-cleanup-assets.test.py
          python tests/style2-cleanup-pass3.test.py
          python tests/enemy-animation-assets.test.py
