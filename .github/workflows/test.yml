name: Test Denkmal TD

on:
  push:
    branches: ["main", "release/v3.*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Persistent loot regression suite
        run: node tests/loot.test.cjs
      - name: Gameplay regression suite
        run: node tests/game.test.cjs
      - name: Mobile gameplay regression suite
        run: TEST_MOBILE=1 node tests/game.test.cjs
      - name: Combat FX regression suite
        run: node tests/combat-fx.test.cjs
      - name: v3.1 + v3.2 feature regression suite
        run: node tests/v3.1-features.test.cjs

      - name: Verify hero image decoding
        run: |
          python -m pip install Pillow
          python tests/assets.test.py
