name: TD2 V5 isolated preflight (read-only)
on:
  push:
    branches:
      - feature/v5-integration-preflight-20261106
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: td2-v5-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Existing gameplay, art, Ansturm and mobile baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image test dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy scipy
      - name: Campaign and Android-emulation regressions
        run: |
          node tests/game.test.cjs
          TEST_MOBILE=1 node tests/game.test.cjs
      - name: Ansturm simulation regressions
        run: npm test --prefix ansturm-alpha1-5
      - name: Reject magenta residue in active hero/menu assets
        run: python tests/hero-art-magenta-gate.test.py
      - name: Verify asset references and headers
        run: |
          python tests/assets-headers.test.py
          python tests/assets.test.py
