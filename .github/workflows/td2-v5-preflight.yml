name: TD2 V5 isolated preflight (read-only)

on:
  push:
    branches:
      - feature/v5-integration-preflight-20261106
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td2-v5-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Existing gameplay, art, Ansturm and mobile baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout V5 preflight branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install image test dependencies
        run: python -m pip install Pillow numpy scipy
      - name: Python image and asset regressions
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for file in tests/*.test.py; do
            if ! python "$file" > /tmp/pyout 2>&1; then
              failed=1
              msg=$(tail -n 3 /tmp/pyout | tr '\n' ' ' | tr -d '\r' | head -c 180)
              echo "::error title=PYFAIL $file::$msg"
              echo "PYFAIL $file"
            fi
          done
          exit $failed
