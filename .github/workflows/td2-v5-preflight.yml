name: TD2 V5 isolated preflight (read-only)

on:
  push:
    branches:
      - feature/v5-integration-preflight-20261106
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td2-v5-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Existing gameplay, art, Ansturm and mobile baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout V5 preflight branch
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install image test dependencies
        run: python -m pip install Pillow numpy scipy
      - name: Report magenta residue files
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PYEOF' > /tmp/magenta.txt 2>&1
          import os, re
          from pathlib import Path
          from PIL import Image
          ROOT = Path('.').resolve()
          DIST = ROOT / 'dist'
          REF = re.compile(r"assets/[A-Za-z0-9_./-]+\.(?:webp|png)")
          SCOPE = ('/hero/', '/menu/', 'directional-v410/marcel', 'directional-v410/kim', '-v5b', '-v6')
          refs = set()
          for dirpath, _dirs, files in os.walk(DIST):
              for name in files:
                  if not name.lower().endswith(('.js', '.css', '.html')):
                      continue
                  text = open(os.path.join(dirpath, name), encoding='utf-8', errors='replace').read()
                  for match in REF.finditer(text):
                      candidate = Path(dirpath) / match.group(0)
                      if not candidate.exists():
                          candidate = DIST / match.group(0)
                      if candidate.exists():
                          refs.add(candidate)
          flagged = []
          for path in sorted(refs):
              rel = str(path.relative_to(DIST))
              if not any(key in rel for key in SCOPE):
                  continue
              if path.suffix.lower() not in ('.webp', '.png'):
                  continue
              with Image.open(path) as image:
                  rgba = image.convert('RGBA')
                  w, h = rgba.size
                  px = rgba.load()
                  hits = 0
                  first = None
                  for y in range(0, h, 2):
                      for x in range(0, w, 2):
                          r, g, b, a = px[x, y]
                          if a > 8 and r > 180 and b > 120 and g < 90:
                              hits += 1
                              if first is None:
                                  first = (x, y, r, g, b, a)
                  if hits:
                      flagged.append((rel, hits, w * h // 4, first))
          for rel, hits, total, first in flagged:
              print(f"MAGENTA {rel} hits={hits}/{total} first={first}")
          print(f"scanned={len(refs)}")
          PYEOF
          cat /tmp/magenta.txt
          msg=$(tr '\n' ';' < /tmp/magenta.txt | tr -d '\r' | head -c 250)
          echo "::error title=MAGENTA_REPORT::$msg"
          exit 1
