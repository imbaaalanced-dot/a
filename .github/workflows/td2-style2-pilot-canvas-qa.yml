name: TD2 Style-2 opt-in Kirchende and Westhofen canvas QA

on:
  push:
    branches: ['feature/style2-pilot-kirchende-westhofen-canvas-20261112']
  pull_request:
    branches: ['assets/style2-pilot-runtime-candidate-20261112', main]
    paths:
      - 'dist/terrain-polish.js'
      - 'tools/verify-style2-pilot-ground-browser.cjs'
      - '.github/workflows/td2-style2-pilot-canvas-qa.yml'
      - 'dist/assets/style2-pilot-v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canvas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'Pillow==12.3.0'
      - name: Verify staging and render baseline
        run: |
          python tests/style2-pilot-runtime-assets.test.py
          node tests/canonical-style2-runtime.test.cjs
          node tests/kirchende-loading.test.cjs
          node tests/westhofen.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Actual desktop Chromium and touch-emulated pilot scenes
        run: node tools/verify-style2-pilot-ground-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: td2-style2-pilot-optin-kirchende-westhofen
          path: /tmp/td2-pilot-canvas/
          if-no-files-found: warn
          retention-days: 7
