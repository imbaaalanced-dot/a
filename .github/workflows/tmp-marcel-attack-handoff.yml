name: Temporary binary handoff for Marcel attack-down candidates
on:
  push:
    branches: [art/marcel-down-attack-candidates-20261113]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Decode payloads and verify checksums
        run: |
          set -euxo pipefail
          ls -la .handoff/marcel-attack-down/
          mkdir -p source-art/hero/actions-v5/marcel/down/attack
          base64 -d .handoff/marcel-attack-down/candidate-00.b64.txt > source-art/hero/actions-v5/marcel/down/attack/00.png
          base64 -d .handoff/marcel-attack-down/candidate-01.b64.txt > source-art/hero/actions-v5/marcel/down/attack/01.png
          base64 -d .handoff/marcel-attack-down/candidate-02.b64.txt > source-art/hero/actions-v5/marcel/down/attack/02.png
          base64 -d .handoff/marcel-attack-down/candidate-03.b64.txt > source-art/hero/actions-v5/marcel/down/attack/03.png
          base64 -d .handoff/marcel-attack-down/candidate-04.b64.txt > source-art/hero/actions-v5/marcel/down/attack/04.png
          base64 -d .handoff/marcel-attack-down/candidate-05.b64.txt > source-art/hero/actions-v5/marcel/down/attack/05.png
          base64 -d .handoff/marcel-attack-down/concept-sheet.b64.txt > source-art/hero/actions-v5/marcel/down/marcel-attack-down-concept-3x2.png
          base64 -d .handoff/marcel-attack-down/preview-6x1.b64.txt > source-art/hero/actions-v5/marcel/down/marcel-attack-down-preview-6x1.png
          sha256sum -c .handoff/marcel-attack-down/sha256.txt
      - name: Commit decoded art and remove handoff payloads
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-art/hero/actions-v5/marcel/down
          git rm -r -q .handoff
          git rm -q .github/workflows/tmp-marcel-attack-handoff.yml
          git commit -m "art(Style 2): decode Marcel attack-down candidate frames from temporary handoff"
          git push
      - name: Diagnose on failure
        if: failure()
        run: |
          set +e
          {
            echo "=== runner context ==="
            echo "GITHUB_REF=$GITHUB_REF SHA=$GITHUB_SHA"
            echo "=== git status ==="
            git status --short
            echo "=== git log ==="
            git log --oneline -5
            echo "=== sha256 verbose ==="
            sha256sum -c .handoff/marcel-attack-down/sha256.txt
            echo "=== ls handoff ==="
            ls -la .handoff/marcel-attack-down/ || true
          } > failure-diagnosis.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add failure-diagnosis.txt
          git commit -m "chore(handoff): write failure diagnosis" || exit 0
          git push || exit 0
