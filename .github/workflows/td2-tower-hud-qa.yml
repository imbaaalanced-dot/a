name: TD2 tower shop and responsive HUD QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/game.js'
      - 'dist/index.html'
      - 'dist/combat-hud-layout-v3.css'
      - 'tests/tower-shop-hud.test.cjs'
      - 'tools/verify-tower-hud-browser.cjs'
      - '.github/workflows/td2-tower-hud-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-qa:
    name: Five-tower build shop and desktop/touch HUD
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static menu, cache and old-save regression
        run: |
          node tests/tower-shop-hud.test.cjs
          node tests/cache-busting.test.cjs
          node tests/v4-alpha5.test.cjs
          node tests/touch-build.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Inspect HUD and keyboard selection in five actual Chromium viewports
        env:
          TD2_TOWER_HUD_OUT: /tmp/td2-tower-hud-qa
        run: timeout 270s node tools/verify-tower-hud-browser.cjs
      - name: Assemble browser screenshot review for visual QA
        env:
          TD2_TOWER_HUD_OUT: /tmp/td2-tower-hud-qa
        run: |
          python3 -m pip install --quiet 'Pillow>=11,<14'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import base64,os
          out=Path(os.environ['TD2_TOWER_HUD_OUT'])
          panel=Image.new('RGB',(1440,1000),'#141b19')
          d=ImageDraw.Draw(panel)
          d.text((22,20),'TD2 TOWER SHOP / ACTION HUD - ACTUAL CHROMIUM SCREENSHOTS',fill='#f2e4be')
          top=[('desktop-1649.png',22,67,900,345),('desktop-900.png',940,67,475,345)]
          for file,x,y,w,h in top:
              src=Image.open(out/file).convert('RGB')
              # Clip the bottom toolbar area, preserving actual pixels and positions.
              cropped=src.crop((max(0,src.width-min(src.width,1050)),max(0,src.height-310),src.width,src.height))
              cropped.thumbnail((w,h),Image.Resampling.LANCZOS)
              panel.paste(cropped,(x,y))
              d.text((x,y+cropped.height+8),file+' - bottom toolbar close-up',fill='#e4d6b9')
          for file,x in [('mobile-412.png',350),('mobile-360.png',830)]:
              src=Image.open(out/file).convert('RGB')
              src.thumbnail((300,495),Image.Resampling.LANCZOS)
              panel.paste(src,(x,470))
              d.text((x,976),file+' - touch layout',fill='#e4d6b9')
          f=out/'td2-tower-hud-visual-review.jpg'
          panel.save(f,quality=70,optimize=True)
          print('TD2_TOWER_HUD_REVIEW_B64='+base64.b64encode(f.read_bytes()).decode('ascii'))
          print('TD2_TOWER_HUD_REVIEW_BYTES='+str(f.stat().st_size))
          PY
      - name: Upload gameplay screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td2-five-tower-hud-chromium
          path: /tmp/td2-tower-hud-qa/
          retention-days: 14
          if-no-files-found: warn
