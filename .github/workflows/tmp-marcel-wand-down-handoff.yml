name: Temporary binary handoff for Marcel wand-down candidates
on:
  push:
    branches: [art/marcel-wand-down-candidates-v2-20261115]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Decode payloads and verify checksums
        run: |
          set -euxo pipefail
          ls -la .handoff/marcel-wand-down/
          DEST=source-art/hero/actions-v5/marcel/down
          mkdir -p $DEST/attack $DEST/hit $DEST/death
          for act in attack hit death; do
            for i in 0 1 2 3 4 5; do
              base64 -d .handoff/marcel-wand-down/$act-$i.b64.txt > $DEST/$act/0$i.png
            done
            cat .handoff/marcel-wand-down/$act-sheet-a.b64.txt .handoff/marcel-wand-down/$act-sheet-b.b64.txt | base64 -d > $DEST/marcel-$act-down-concept-3x2.png
            base64 -d .handoff/marcel-wand-down/$act-preview.b64.txt > $DEST/marcel-$act-down-preview-6x1.png
          done
          sha256sum -c .handoff/marcel-wand-down/sha256.txt
      - name: Commit decoded art and remove handoff payloads
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-art/hero/actions-v5/marcel/down
          git rm -r -q .handoff
          git rm -q .github/workflows/tmp-marcel-wand-down-handoff.yml
          git commit -m "art(Style 2): decode Marcel wand-down candidate frames (20261115 reference) from temporary handoff"
          git push
      - name: Diagnose on failure
        if: failure()
        run: |
          set +e
          {
            echo "=== runner context ==="
            echo "GITHUB_REF=$GITHUB_REF SHA=$GITHUB_SHA"
            echo "=== git status ==="
            git status --short
            echo "=== sha256 verbose ==="
            sha256sum -c .handoff/marcel-wand-down/sha256.txt
            echo "=== ls handoff ==="
            ls -la .handoff/marcel-wand-down/ || true
          } > failure-diagnosis.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add failure-diagnosis.txt
          git commit -m "chore(handoff): write failure diagnosis" || exit 0
          git push || exit 0
