name: TD2 Pages preservation Chromium smoke
on:
  push:
    branches: [fix/td2-preserve-pages-previews-20261110]
    paths:
      - '.github/workflows/td2-pages-preservation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-and-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pages preservation and gameplay regression
        run: |
          set -euo pipefail
          node tests/pages-preview-preservation.test.cjs
          node tests/consolidation-publish.test.cjs
          node tests/mobile-frame-pacing.test.cjs
          TEST_MOBILE=1 node tests/game.test.cjs
      - name: Chromium desktop and touch portrait
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
          node tools/verify-canonical-style2-browser.cjs
