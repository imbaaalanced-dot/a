name: TD2 canonical hero and tower art QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/hero-saga.js'
      - 'dist/directional-hero-assets-v5.js'
      - 'dist/directional-actions-v410.js'
      - 'dist/game.js'
      - 'dist/combat-fx.js'
      - 'dist/index.html'
      - 'dist/terrain-polish.js'
      - 'dist/kirchende-art.js'
      - 'dist/style2-level4-reference.js'
      - 'dist/hohensyburg-art.js'
      - 'dist/goethestrasse-art.js'
      - 'dist/assets/kirchende/ground-style2-v1.webp'
      - 'dist/assets/kirchende/environment-atlas-style2-v1.webp'
      - 'tests/kirchende-loading.test.cjs'
      - 'tests/style2-level4-reference.test.cjs'
      - 'tests/level4.test.cjs'
      - 'tests/level5.test.cjs'
      - 'tests/goethestrasse.test.cjs'
      - 'tests/canonical-style2-runtime.test.cjs'
      - 'tests/environment-style2-pilot.test.cjs'
      - 'tools/verify-canonical-style2-browser.cjs'
      - 'tools/verify-style2-environment-pilot.cjs'
      - 'tools/verify-level4-style2-environment.cjs'
      - 'tools/verify-level5-style2-environment.cjs'
      - 'tools/verify-level6-style2-environment.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical hero and tower tests
        run: |
          node tests/canonical-style2-runtime.test.cjs
          node tests/canonical-hero-art-v5.test.cjs
          node tests/hero-style2-v5.test.cjs
          node tests/hero-sprites-v5b.test.cjs
          TEST_MOBILE=1 node tests/game.test.cjs
      - name: Chromium desktop and emulated touch portrait
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
          node tools/verify-canonical-style2-browser.cjs
      - name: Kirchende environment pilot gameplay preview
        run: node tools/verify-style2-environment-pilot.cjs
      - name: Ender Dorfkirche shared Style-2 environment preview
        run: |
          node tests/kirchende-loading.test.cjs
          node tests/style2-level4-reference.test.cjs
          node tests/level4.test.cjs
          node tools/verify-level4-style2-environment.cjs
      - name: Hohensyburg shared Style-2 environment preview
        run: |
          node tests/level5.test.cjs
          node tools/verify-level5-style2-environment.cjs
      - name: Goethestraße shared Style-2 environment preview
        run: |
          node tests/goethestrasse.test.cjs
          node tools/verify-level6-style2-environment.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v5-style2-canonical-art-and-environment-previews
          path: |
            /tmp/td2-canonical-art-pilot/
            /tmp/td2-environment-pilot/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: level4-ender-dorfkirche-style2-environment-preview
          path: /tmp/td2-level4-environment/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: level5-hohensyburg-style2-environment-preview
          path: /tmp/td2-level5-environment/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: level6-goethestrasse-style2-environment-preview
          path: /tmp/td2-level6-environment/
          if-no-files-found: warn
          retention-days: 7
