name: TD2 CDN pilot real Chromium QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/cdn-asset-map.js'
      - 'dist/asset-manager.js'
      - 'dist/preloader.js'
      - 'dist/index.html'
      - 'tools/verify-cdn-pilot-browser.cjs'
      - 'tests/cdn-asset-map.test.cjs'
      - '.github/workflows/td2-cdn-pilot-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Real CDN request, local default and offline fallback
        run: node tools/verify-cdn-pilot-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: td2-cdn-pilot-real-chromium-qa
          path: /tmp/td2-cdn-pilot-browser/
          if-no-files-found: warn
          retention-days: 7
