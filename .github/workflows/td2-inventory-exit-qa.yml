name: TD2 inventory exit and Back QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/game.js'
      - 'dist/loot-ui.js'
      - 'dist/loot.css'
      - 'dist/index.html'
      - 'tests/loot-ui.test.cjs'
      - 'tests/cache-busting.test.cjs'
      - 'tools/verify-equipment-browser.cjs'
      - '.github/workflows/td2-inventory-exit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-exit:
    name: Desktop and touch inventory Back/scroll regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit regressions
        run: |
          node --check dist/game.js
          node --check dist/loot-ui.js
          node --check tools/verify-equipment-browser.cjs
          node tests/loot-ui.test.cjs
          node tests/cache-busting.test.cjs
      - name: Install Chromium for actual UI hit-target tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Verify desktop and touch overlays, Escape and history Back
        timeout-minutes: 7
        run: |
          TD2_QA_OUT=/tmp/td2-inventory-exit-qa timeout 360s node tools/verify-equipment-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inventory-exit-browser-qa
          path: /tmp/td2-inventory-exit-qa
          if-no-files-found: ignore
