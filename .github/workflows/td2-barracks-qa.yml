name: TD2 barracks Chromium acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/barracks*'
      - 'tools/verify-barracks-browser.cjs'
      - '.github/workflows/td2-barracks-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  barracks-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/barracks.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Desktop and mobile touch barracks lifecycle
        run: node tools/verify-barracks-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barracks-chromium
          path: /tmp/td2-barracks-qa
