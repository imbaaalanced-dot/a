name: Deploy compact TD2 Pages with verified gallery
on:
  push:
    branches: [fix/pages-size-and-preview-20261106]
    paths: [.github/workflows/deploy-compact-pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6
      - name: Assemble compact live site with recent previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/td2-live-site
          cp -a dist/. /tmp/td2-live-site/
          git fetch origin integrate/style2-portrait-gallery-review-20261105 gh-pages
          git worktree add /tmp/td2-integration origin/integrate/style2-portrait-gallery-review-20261105
          mkdir -p /tmp/td2-live-site/td2-style2-gallery-preview
          cp -a /tmp/td2-integration/dist/. /tmp/td2-live-site/td2-style2-gallery-preview/
          git worktree add /tmp/td2-previous-pages origin/gh-pages
          for path in td2-menu-integration-20261106 td2-ansturm td2-combined td2-all-patches v4-alpha9; do
            if [ -d "/tmp/td2-previous-pages/$path" ]; then
              cp -a "/tmp/td2-previous-pages/$path" "/tmp/td2-live-site/$path"
            fi
          done
          touch /tmp/td2-live-site/.nojekyll
          test -s /tmp/td2-live-site/index.html
          test -s /tmp/td2-live-site/td2-style2-gallery-preview/index.html
          test -s /tmp/td2-live-site/td2-style2-gallery-preview/level-gallery.js
          test -s /tmp/td2-live-site/td2-style2-gallery-preview/level-gallery.css
          test -s /tmp/td2-live-site/td2-style2-gallery-preview/assets/menu/level-gallery/card-locked.webp
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/td2-live-site')
          size=sum(f.stat().st_size for f in root.rglob('*') if f.is_file())
          print(f'PAGES_BYTES={size}')
          assert size < 900_000_000, f'Over safety limit: {size}'
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/td2-live-site
      - name: Deploy compact site
        id: deploy
        uses: actions/deploy-pages@v4
