name: TD2 Westhofen V3 isolated runtime Chromium acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/assets/westhofen/westhofen-memorial-style2-v3-preview.svg'
      - 'dist/westhofen-art.js'
      - 'dist/asset-manager.js'
      - 'tests/westhofen-v3-runtime.test.cjs'
      - 'tools/verify-level7-style2-environment.cjs'
      - '.github/workflows/td2-westhofen-v3-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level7-v3:
    name: V3 decoded and drawn in actual desktop and touch-emulated Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current V3 sprite, V2 rollback and Level 7 save logic
        run: |
          node tests/westhofen-v3-runtime.test.cjs
          node tests/westhofen-v2-runtime.test.cjs
          node tests/westhofen-style2-art.test.cjs
          node tests/level67-single-image-owner.test.cjs
          node tests/asset-manager.test.cjs
          node tests/westhofen.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Verify V3 load, draw calls, gameplay and touch emulation
        env:
          TD2_LEVEL7_ENVIRONMENT_OUT: /tmp/td2-westhofen-v3-integration
        run: timeout 240s node tools/verify-level7-style2-environment.cjs
      - name: Save actual Chromium gameplay and sprite review images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: westhofen-v3-level7-chromium-review-only
          path: /tmp/td2-westhofen-v3-integration/
          if-no-files-found: warn
          retention-days: 14
