name: Westhofen V4.3 isolated QA (no deployment)

on:
  push:
    branches:
      - feature/v4.3-westhofen-qa-pr-trigger
  pull_request:
    branches:
      - feature/v4.3-westhofen-qa-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: westhofen-v43-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full gameplay and art regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image test dependencies
        run: python -m pip install Pillow numpy scipy

      - name: Test all Python assets
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.py; do python "$file"; done

      - name: Test Ansturm
        run: npm test --prefix ansturm-alpha1-5

      - name: Test all Node gameplay and graphics
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.cjs; do node "$file"; done

      - name: Test mobile logic and state migration
        shell: bash
        env:
          TEST_MOBILE: '1'
        run: |
          set -euo pipefail
          for file in game.test.cjs portal-gameplay.test.cjs menu-navigation.test.cjs alpha8-preview.test.cjs level5-preview.test.cjs level4.test.cjs v4-alpha5.test.cjs; do
            node "tests/$file"
          done
