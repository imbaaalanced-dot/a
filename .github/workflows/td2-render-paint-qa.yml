name: TD2 render callback pooling QA

on:
  push:
    branches:
      - feature/v4.3-render-paint-callback-pool
  pull_request:
    branches:
      - feature/v4.3-cpu-render-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td2-render-paint-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gameplay, image and performance telemetry regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image regression dependencies
        run: python -m pip install Pillow numpy scipy
      - name: Python image regression tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.py; do python "$file"; done
      - name: Ansturm regression tests
        run: npm test --prefix ansturm-alpha1-5
      - name: All Node gameplay and performance tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.cjs; do node "$file"; done
      - name: Android mobile logic regressions
        env:
          TEST_MOBILE: '1'
        shell: bash
        run: |
          set -euo pipefail
          for file in game.test.cjs portal-gameplay.test.cjs menu-navigation.test.cjs alpha8-preview.test.cjs level5-preview.test.cjs level4.test.cjs v4-alpha5.test.cjs; do
            node "tests/$file"
          done
