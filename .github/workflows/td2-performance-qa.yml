name: TD2 V4.3 performance integration QA

on:
  push:
    branches:
      - feature/v4.3-performance-integration-qa
      - feature/v4.3-performance-qa-test-fix
  pull_request:
    branches:
      - feature/v4.3-adaptive-mobile-resolution
      - feature/v4.3-performance-android-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td2-performance-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full regression with performance patches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-test packages
        run: python -m pip install Pillow numpy scipy
      - name: Python asset regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.py; do python "$file"; done
      - name: Ansturm regression suite
        run: npm test --prefix ansturm-alpha1-5
      - name: Node gameplay, art, performance regression suites
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.cjs; do node "$file"; done
      - name: Mobile logic regression suite
        env:
          TEST_MOBILE: '1'
        shell: bash
        run: |
          set -euo pipefail
          for file in game.test.cjs portal-gameplay.test.cjs menu-navigation.test.cjs alpha8-preview.test.cjs level5-preview.test.cjs level4.test.cjs v4-alpha5.test.cjs; do
            node "tests/$file"
          done
