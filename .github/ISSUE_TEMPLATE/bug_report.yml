name: Bug Report
description: Melde einen Fehler in Denkmal TD2
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist tatsächlich passiert?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      description: Bitte nenne Spielmodus, Level und Welle.
      placeholder: |
        1. Starte Level ...
        2. Tippe auf ...
        3. Fehler tritt auf ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: Gerät, Betriebssystem, Browser/WebView und Spielversion
      placeholder: "z. B. Android 13, Chrome, 4 GB RAM"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Belege (optional)
      description: Screenshot, Video oder konkrete FPS-/RAM-Messung; bitte keine erfundenen Werte.
    validations:
      required: false
