<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TD2 20-Wellen-Labortest</title><style>body{margin:0;background:#101820;color:#eee;font:15px system-ui}header,footer{padding:12px;background:#222d32}button,select{background:#35483c;color:white;border:1px solid #a6ba86;padding:9px;margin:3px;border-radius:5px}canvas{width:100%;max-height:65vh;touch-action:manipulation;background:#1b2928}small{color:#e0c68b}</style></head><body><header><b>TD2 · 20-Wellen-Labortest</b><p><small>Separater, vereinfachter Spieltest des Planers aus PR #123. Nicht die vollständige TD2-Kampagne. Keine Spielstände werden verändert.</small></p><label>Kapitel <select id="chapter"></select></label><button id="start">Welle starten</button><button id="speed">Tempo 1×</button><div id="status"></div></header><canvas id="field" width="800" height="520"></canvas><footer>Tippe ins Spielfeld, um für 20 Gold einen Turm zu bauen. Türme schießen automatisch. Besiege Welle 10 und 20 mit Boss. <span id="log"></span></footer><script src="campaign-20-wave-plan.js"></script><script>
(()=>{'use strict';const P=globalThis.DenkmalCampaign20,cv=document.querySelector('#field'),ctx=cv.getContext('2d'),ch=document.querySelector('#chapter'),status=document.querySelector('#status'),log=document.querySelector('#log');for(let i=1;i<=7;i++){const o=document.createElement('option');o.value=i;o.textContent=i;ch.append(o)}let level=1,local=1,gold=90,hp=100,towers=[],enemies=[],shots=[],active=false,spawned=0,timer=0,speed=1,last=performance.now(),plan=null;const path=[[-30,100],[180,100],[180,410],[430,410],[430,210],[830,210]];const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function reset(){level=+ch.value;local=1;gold=90;hp=100;towers=[];enemies=[];shots=[];active=false;spawned=0;timer=0;plan=null;log.textContent=''}ch.onchange=reset;document.querySelector('#speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;document.querySelector('#speed').textContent='Tempo '+speed+'×'};document.querySelector('#start').onclick=()=>{if(active||enemies.length||local>20||hp<=0)return;plan=P.describe(level,(level-1)*20+local);spawned=0;timer=0;active=true};cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*520/r.height;if(gold<20||towers.some(t=>distance(t,{x,y})<44))return;if(path.some((p,i)=>i&&segmentDistance({x,y},{x:path[i-1][0],y:path[i-1][1]},{x:p[0],y:p[1]})<35))return;towers.push({x,y,cool:0});gold-=20});function segmentDistance(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}function tick(dt){if(hp<=0)return;if(active&&spawned<plan.count){timer-=dt;if(timer<=0){const type=P.enemyType(level,plan.wave,spawned++),boss=type==='boss'||type==='uprooted';enemies.push({x:path[0][0],y:path[0][1],segment:1,type,boss,hp:boss?190+local*12:18+local*3,max:boss?190+local*12:18+local*3,speed:boss?28:40+(spawned%4)*9});timer=plan.interval}}for(const e of enemies){const goal=path[e.segment];if(!goal){e.dead=true;hp-=e.boss?25:6;continue}const dx=goal[0]-e.x,dy=goal[1]-e.y,d=Math.hypot(dx,dy),step=e.speed*dt;if(step>=d){e.x=goal[0];e.y=goal[1];e.segment++}else{e.x+=dx/d*step;e.y+=dy/d*step}}for(const t of towers){t.cool-=dt;if(t.cool<=0){const target=enemies.find(e=>!e.dead&&distance(t,e)<160);if(target){target.hp-=16;t.cool=.42;shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,ttl:.12});if(target.hp<=0){target.dead=true;gold+=target.boss?45:5}}}}shots=shots.filter(s=>(s.ttl-=dt)>0);enemies=enemies.filter(e=>!e.dead);if(active&&spawned>=plan.count&&!enemies.length){active=false;gold+=25;log.textContent='Welle '+local+' geschafft. ';local++}}function draw(){ctx.clearRect(0,0,800,520);ctx.strokeStyle='#8b8068';ctx.lineWidth=46;ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();for(const t of towers){ctx.fillStyle='#d2b875';ctx.beginPath();ctx.arc(t.x,t.y,15,0,7);ctx.fill()}for(const e of enemies){ctx.fillStyle=e.boss?'#e25654':'#a9bdab';ctx.beginPath();ctx.arc(e.x,e.y,e.boss?23:11,0,7);ctx.fill();ctx.fillStyle='#ff5e60';ctx.fillRect(e.x-16,e.y-23,32*Math.max(0,e.hp/e.max),3)}ctx.strokeStyle='#f9d879';ctx.lineWidth=3;for(const s of shots){ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.tx,s.ty);ctx.stroke()}status.textContent='Kapitel '+level+' · Welle '+Math.min(local,20)+'/20 · Gold '+gold+' · Denkmal '+hp+' HP · Gegner '+enemies.length+(active?' · Spawn '+spawned+'/'+plan.count:'')+(local>20?' · KAPITEL GESCHAFFT':'')+(hp<=0?' · VERLOREN':'')}function frame(now){const dt=Math.min(.05,(now-last)/1000)*speed;last=now;tick(dt);draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
